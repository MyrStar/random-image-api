services:
  random-image-api:
    build: .
    container_name: random-image-api
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./data:/app/data        # 持久化数据库
      - ./.env:/app/.env:ro     # 挂载配置文件
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 说明：不要给容器钉公共 DNS 或手动调低 MTU。
# - 七牛按解析者位置调度 CDN 节点，公共 DNS 与宿主机解析结果可能不同；
# - 宿主机物理 MTU 正常时，手动设小 MTU 会造成大包黑洞（TCP 握手通、大响应挂起）。
# 若服务端取图超时，先用宿主机 curl 直测源站 URL 分流网络问题，再查应用日志。
