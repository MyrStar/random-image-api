services:
  random-image-api:
    build: .
    container_name: random-image-api
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./data:/app/data        # 持久化数据库
      - ./.env:/app/.env:ro     # 挂载配置文件
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
